# Default config for:
#   bash scripts/build-release-image.sh
#
# CLI behavior:
# - No CLI arguments: load this file and validate it.
# - Any CLI argument: ignore this file completely and use CLI args only.
#
# Recommended quick setup for frequent systemd upgrades:
# PRESET=systemd-upgrade
# OUTPUT_DIR=/tmp/lexora-server-release

# Optional shortcut preset.
# Supported:
#   systemd-upgrade
PRESET=

# Required in no-arg mode.
# Example:
#   /tmp/lexora-server-release
OUTPUT_DIR=/tmp/lexora-server-release

# Optional explicit target instead of PRESET.
# Supported:
#   docker
#   systemd
TARGET=docker

# Only used when TARGET=systemd or PRESET resolves to a systemd package.
# Supported:
#   host-jre
#   bundled-jre
SYSTEMD_RUNTIME=host-jre

# Only used for systemd packaging.
# Supported:
#   yes
#   no
SYSTEMD_MYSQL_EXAMPLE=no

# Supported:
#   mirror
LAYOUT=
