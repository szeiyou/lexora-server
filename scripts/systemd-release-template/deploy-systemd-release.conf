# Default config for:
#   bash ./deploy-systemd-release.sh
#
# CLI behavior:
# - No CLI arguments: load this file and validate it.
# - Any CLI argument: ignore this file completely and use CLI args only.
#
# Typical presets:
# - First deployment of a bundled-jre package:
#     DEPLOY_MODE=full
# - Later version upgrades on the same host:
#     DEPLOY_MODE=upgrade

# Supported:
#   upgrade
#   full
DEPLOY_MODE=upgrade

# Target host settings used in no-arg mode.
REMOTE_HOST=
REMOTE_PORT=22
REMOTE_USER=root
REMOTE_PASSWORD=
REMOTE_DEPLOY_ROOT=/root/dicserver-deploy

# Keep the existing remote /etc/dicserver/dicserver.env by default.
# Supported:
#   yes
#   no
OVERWRITE_ENV=no

# Restart immediately after syncing package files on the remote host.
# Supported:
#   yes
#   no
FORCE_RESTART=no

# Remove the remote temporary upload directory after a successful deploy.
# Supported:
#   yes
#   no
REMOTE_CLEANUP=yes

# Temporary host, do not prompt for host-key confirmation.
# Supported:
#   yes
#   no
SSH_STRICT_HOST_KEY_CHECKING=no
