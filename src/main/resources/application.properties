# Actuator
management.endpoints.web.exposure.include=health,info,caches,metrics
management.endpoint.health.show-details=always

# Auth
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.access-token-ttl-seconds=${APP_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
app.auth.refresh-token-ttl-seconds=${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
app.auth.refresh-token-bytes=${APP_AUTH_REFRESH_TOKEN_BYTES:32}

# Rate Limiting
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

# Page size limit
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.one-indexed-parameters=true

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# File encoding settings
spring.config.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.application.name=LexoraServer
server.port=8080

# MySQL configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dictionary?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=60000

# Database initialization settings
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Query history cleanup
cleanup.query-history.retention-days=${CLEANUP_SEARCH_HISTORY_RETENTION_DAYS:90}

# Audio storage
audio.storage.directory=${AUDIO_STORAGE_DIR:./audio-data}

# TTS provider selection: qwen3 | tencent | mimo
tts.provider=${TTS_PROVIDER:qwen3}

# Qwen3-TTS configuration
tts.qwen3.base-url=${TTS_BASE_URL:http://localhost:8000}
tts.qwen3.api-key=${TTS_API_KEY:}
tts.qwen3.speaker=${TTS_SPEAKER:vivian}
tts.qwen3.generation.max-new-tokens=${TTS_QWEN3_GENERATION_MAX_NEW_TOKENS:1024}
tts.qwen3.generation.temperature=${TTS_QWEN3_GENERATION_TEMPERATURE:0.1}
tts.qwen3.generation.top-k=${TTS_QWEN3_GENERATION_TOP_K:20}
tts.qwen3.generation.top-p=${TTS_QWEN3_GENERATION_TOP_P:0.9}
tts.qwen3.generation.repetition-penalty=${TTS_QWEN3_GENERATION_REPETITION_PENALTY:1.05}
audio.generation.scheduler.window.start=${AUDIO_GENERATION_SCHEDULER_WINDOW_START:00:00}
audio.generation.scheduler.window.end=${AUDIO_GENERATION_SCHEDULER_WINDOW_END:02:00}
audio.generation.scheduler.tick-seconds=${AUDIO_GENERATION_SCHEDULER_TICK_SECONDS:300}
audio.generation.scheduler.zone-id=${AUDIO_GENERATION_SCHEDULER_ZONE_ID:Asia/Shanghai}

# Tencent Cloud TTS configuration (optional)
tts.tencent.secret-id=${TENCENT_TTS_SECRET_ID:}
tts.tencent.secret-key=${TENCENT_TTS_SECRET_KEY:}
tts.tencent.app-id=${TENCENT_TTS_APP_ID:}
tts.tencent.voice-type=${TENCENT_TTS_VOICE_TYPE:502001}
tts.tencent.emotion-category=${TENCENT_TTS_EMOTION:story}

# Xiaomi MiMo TTS configuration (optional, OpenAI Chat Completions compatible)
# Provider only activates when tts.mimo.api-key is set.
tts.mimo.base-url=${MIMO_TTS_BASE_URL:https://api.xiaomimimo.com/v1}
tts.mimo.api-key=${MIMO_TTS_API_KEY:}
tts.mimo.model=${MIMO_TTS_MODEL:mimo-v2.5-tts}
tts.mimo.voice=${MIMO_TTS_VOICE:Mia}
tts.mimo.format=${MIMO_TTS_FORMAT:mp3}

# Prompt template
llm.prompt.template="\
You are an experienced English teacher. When I give you a word, please provide detailed explanations and examples in the following format.\n\
Include all possible parts of speech in the 'partOfSpeech' field, provide meanings in Chinese in the 'meaning' field, and make the explanations as comprehensive as possible.\n\
Please provide a parseable JSON content strictly following the format below, do not add any meaningless spaces or markdown marks, and do not add any other content:\n\
\n\
For the 'extension' field, please provide additional information in Chinese, following this example for the word 'phenomenon' (remember to repeat the word three times at the end):\n\
The word comes from Greek 'phainomenon', meaning 'thing appearing to view'. The root 'phen-' means 'to show', sharing the same origin with 'phantom'.\n\
Parts of speech:\n\
1. Noun: An exceptional person or thing\n\
2. Scientific context: An observable fact or event\n\
Academic usage: The northern lights are a natural phenomenon attracting scientists worldwide.\n\
Daily conversation: A: How did she solve it so fast? B: She's a phenomenon!\n\
Related forms:\n\
- Adjective: phenomenal (e.g., phenomenal success)\n\
- Adverb: phenomenally (e.g., phenomenally expensive)\n\
Memory tip: In 'pheno-menon', the three 'e's are like eyes observing the phenomenon.\n\
Practice pronunciation three times:\n\
....... phenomenon... phenomenon... phenomenon\
"
