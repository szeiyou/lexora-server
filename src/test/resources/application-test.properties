spring.datasource.url=jdbc:h2:mem:dicserver;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
app.auth.jwt-secret=0123456789abcdef0123456789abcdef0123456789abcdef
app.auth.access-token-ttl-seconds=900
app.auth.refresh-token-ttl-seconds=604800
app.auth.refresh-token-bytes=32
llm.providers[0].name=test-openai
llm.providers[0].protocol=openai
llm.providers[0].base-url=https://example.test/v1/chat/completions
llm.providers[0].api-key=test-api-key
llm.providers[0].model=test-model
llm.providers[0].enabled=true
llm.providers[0].priority=10
